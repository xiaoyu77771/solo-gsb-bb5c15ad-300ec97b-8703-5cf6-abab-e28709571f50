services:
  cidr-normalizer:
    build: .
    image: cidr-normalizer:latest
    container_name: cidr-normalizer
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; u='http://127.0.0.1:8000/health'; sys.exit(0 if json.load(urllib.request.urlopen(u))['status']=='ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
